name: Publish Draft Release

on:
  push:
    tags:
      - "publish-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.5"
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          TAG="${INPUT_TAG:-${REF_NAME#publish-}}"
          NOTES=".github/release-notes/${TAG}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          if ! gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -q true; then
            echo "No draft release found for $TAG" >&2
            exit 1
          fi
          gh release edit "$TAG" \
            --title "Cat Android Box $TAG" \
            --notes-file "$NOTES" \
            --draft=false
          gh release view "$TAG" --json tagName,name,isDraft,url
