name: Build and Draft Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = if ($config.version) { $config.version } else { (Get-Content package.json -Raw | ConvertFrom-Json).version }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Enable updater artifacts
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content $path

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.event_name == 'push' && github.ref_name || steps.release.outputs.tag }}
          releaseName: "Cat Android Box v__VERSION__"
          releaseBody: |
            Cat Android Box Windows installer.

            - `*-setup.exe`：NSIS 安装包
            - `*.msi`：MSI 安装包
            - `*_portable.zip`：免安装便携版，解压后直接运行 exe

            运行环境：Windows 10 / 11（需要 WebView2，系统通常已自带）。

            刷机、清空账号/用户、清除设备管理员等操作有数据丢失风险，请先备份。
          releaseDraft: true
          prerelease: false

      - name: Create portable zip
        id: portable
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.tag }}"
          $version = $version -replace '^v', ''
          $root = Join-Path $env:RUNNER_TEMP "cat-android-box-portable"
          $app = Join-Path $root "cat-android-box"
          New-Item -ItemType Directory -Force -Path (Join-Path $app "tools") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $app "licenses") | Out-Null

          Copy-Item "src-tauri/target/release/cat-android-box.exe" $app
          if (Test-Path "src-tauri/target/release/tools") {
            Copy-Item "src-tauri/target/release/tools/*" (Join-Path $app "tools") -Recurse -Force
          } else {
            Copy-Item "tools/*" (Join-Path $app "tools") -Recurse -Force
          }
          Copy-Item "src/assets/fonts/OFL.txt" (Join-Path $app "licenses/JetBrainsMono-OFL.txt")
          Copy-Item "src/assets/fonts/NotoSansSC-OFL.txt" (Join-Path $app "licenses/NotoSansSC-OFL.txt")
          Copy-Item "tools/LICENSE-scrcpy.txt" (Join-Path $app "licenses/scrcpy-LICENSE.txt")

          $zip = "cat-android-box_${version}_x64-portable.zip"
          Compress-Archive -Path $app -DestinationPath $zip -Force
          "path=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event_name == 'push' && github.ref_name || steps.release.outputs.tag }}"
          gh release upload "$tag" "${{ steps.portable.outputs.path }}" --clobber
